[theme]
base = "dark"
primaryColor = "#C7F36B"
backgroundColor = "#0A0C0F"
secondaryBackgroundColor = "#12171C"
textColor = "#F4F2EA"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["2.45rem", "1.75rem", "1.35rem", "1.10rem", "1rem", "0.9rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "0.75rem"
buttonRadius = "0.625rem"
borderColor = "#252C33"
dataframeBorderColor = "#252C33"
dataframeHeaderBackgroundColor = "#171D23"
showWidgetBorder = true
showSidebarBorder = true

redColor = "#FF6B6B"
orangeColor = "#FF9F66"
yellowColor = "#F6C85F"
greenColor = "#7BE0A3"
blueColor = "#7CC4FF"
violetColor = "#A992FF"
